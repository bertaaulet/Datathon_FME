<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3f47"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #3a3f47; stroke-width: 1.5; }
      .key { fill: #fff4ec; stroke: #c4532c; stroke-width: 2; }
      .title { font-size: 17px; font-weight: 600; fill: #1d2025; }
      .text { font-size: 14px; fill: #4a505a; }
      .region { font-size: 15px; font-weight: 600; fill: #5a6270; }
      .label { font-size: 13px; fill: #3a3f47; font-style: italic; }
      .line { fill: none; stroke: #3a3f47; stroke-width: 1.6; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f6f7f9"/>

  <!-- Off the board -->
  <rect class="box" x="20" y="90" width="260" height="130" rx="10"/>
  <text class="title" x="36" y="120">Student's browser</text>
  <text class="text" x="36" y="146">Web page (app/index.html)</text>
  <text class="text" x="36" y="168">on a laptop over USB:</text>
  <text class="text" x="36" y="190">adb forward tcp:8090</text>

  <rect class="box" x="20" y="430" width="260" height="190" rx="10"/>
  <text class="title" x="36" y="460">Laptop, ahead of time</text>
  <text class="text" x="36" y="488">M3Kang (research use only)</text>
  <text class="text" x="36" y="512">OCR of the options (RapidOCR)</text>
  <text class="text" x="36" y="536">Agent hint bank, 2 per problem</text>
  <text class="text" x="36" y="560">Translations, Kangaroo baseline</text>
  <text class="text" x="36" y="596">Nothing runs here during use</text>

  <!-- The board -->
  <rect x="320" y="20" width="860" height="680" rx="14" fill="#e9edf2" stroke="#3a3f47" stroke-width="2"/>
  <text class="title" x="340" y="48">Arduino UNO Q 4 GB · fully offline</text>

  <rect x="336" y="64" width="572" height="620" rx="10" fill="#f9fafb" stroke="#9aa3ae" stroke-dasharray="4 3"/>
  <text class="region" x="352" y="90">Linux (Qualcomm QRB2210, Debian)</text>

  <rect x="924" y="64" width="240" height="620" rx="10" fill="#f9fafb" stroke="#9aa3ae" stroke-dasharray="4 3"/>
  <text class="region" x="940" y="90">Microcontroller (STM32U585)</text>

  <!-- Linux boxes -->
  <rect class="key" x="370" y="110" width="250" height="110" rx="8"/>
  <text class="title" x="386" y="138">Tutor · port 8090</text>
  <text class="text" x="386" y="162">app/server.py, copilot/tutor.py</text>
  <text class="text" x="386" y="184">help ladder, leak filter, Elo,</text>
  <text class="text" x="386" y="206">language bridge, the Kangaroo</text>

  <rect class="box" x="650" y="110" width="230" height="110" rx="8"/>
  <text class="title" x="666" y="138">predict.py</text>
  <text class="text" x="666" y="162">official run: one letter A–E</text>
  <text class="text" x="666" y="184">letter bias corrected</text>
  <text class="text" x="666" y="206">at most 60 s per problem</text>

  <rect class="box" x="370" y="300" width="250" height="110" rx="8"/>
  <text class="title" x="386" y="328">llama.cpp · port 8081</text>
  <text class="text" x="386" y="352">Qwen3.5 0.8B, Q8_0</text>
  <text class="text" x="386" y="374">one token: a probability</text>
  <text class="text" x="386" y="396">for each letter A–E</text>

  <rect class="box" x="650" y="300" width="230" height="110" rx="8"/>
  <text class="title" x="666" y="328">llama.cpp · port 8082</text>
  <text class="text" x="666" y="352">bge-small-en-v1.5</text>
  <text class="text" x="666" y="374">embeddings: similar</text>
  <text class="text" x="666" y="396">problems</text>

  <rect class="box" x="370" y="490" width="250" height="100" rx="8"/>
  <text class="title" x="386" y="518">SQLite · data/tutor.db</text>
  <text class="text" x="386" y="542">problems in 6 languages, hints,</text>
  <text class="text" x="386" y="564">the student, attempts, ratings</text>

  <rect class="box" x="650" y="490" width="230" height="100" rx="8"/>
  <text class="title" x="666" y="518">App Lab app (Python)</text>
  <text class="text" x="666" y="542">reads the picture to show</text>
  <text class="text" x="666" y="564">from /api/led (8 × 13)</text>

  <!-- Microcontroller boxes -->
  <rect class="box" x="944" y="490" width="200" height="100" rx="8"/>
  <text class="title" x="960" y="518">Sketch (sketch.ino)</text>
  <text class="text" x="960" y="542">draws each frame</text>

  <rect class="key" x="944" y="610" width="200" height="60" rx="8"/>
  <text class="title" x="960" y="646">LED matrix 8 × 13</text>

  <!-- Arrows -->
  <path class="line" d="M280,155 H368"/>
  <text class="label" x="290" y="145">HTTP</text>

  <path class="line" d="M280,565 H368"/>
  <text class="label" x="288" y="555">copied once</text>

  <path class="line" d="M495,220 V298"/>
  <text class="label" x="488" y="266" text-anchor="end">letter probabilities</text>

  <path class="line" d="M765,220 V250 H580 V298"/>

  <path class="line dash" d="M620,200 H636 V355 H648"/>
  <text class="label" x="652" y="288">outside problems</text>

  <path class="line" d="M370,210 H352 V512 H368"/>

  <path class="line" d="M600,110 V100 H896 V460 H765 V488"/>
  <text class="label" x="776" y="452">/api/led</text>

  <path class="line" d="M880,540 H942"/>
  <text class="label" x="888" y="530">Bridge</text>

  <path class="line" d="M1044,590 V608"/>
</svg>
